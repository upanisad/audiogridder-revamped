name: Build

# Step 1.3 of the work plan: build plugin and server on macOS, Windows and Linux
# on every push and pull request, using the original author's prebuilt
# dependencies (audiogridder-deps) so the baseline matches release 1.2.0.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  # Pinned commit of https://github.com/apohl79/audiogridder-deps
  AG_DEPS_REF: 6a7a41c06b9ca9d4a260febe79ee1f6e96618e0a
  BUILD_TYPE: RelWithDebInfo

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-24.04
            deps: linux-x86_64
            cmake_args: -G Ninja
          - name: macOS arm64
            os: macos-14
            deps: macos-11.1-arm64
            cmake_args: -G Ninja -DCMAKE_OSX_ARCHITECTURES=arm64 -DAG_MACOS_TARGET=11.1
          - name: Windows x64
            os: windows-2022
            deps: windows-x86_64
            cmake_args: -A x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache prebuilt dependencies
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: ag-deps/${{ matrix.deps }}
          key: ag-deps-${{ matrix.deps }}-${{ env.AG_DEPS_REF }}

      - name: Fetch prebuilt dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/apohl79/audiogridder-deps ag-deps
          cd ag-deps
          git sparse-checkout set ${{ matrix.deps }}
          git checkout ${{ env.AG_DEPS_REF }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev \
            libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev libgtk-3-dev libxcb1-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-shape0-dev

      - name: Select Xcode
        if: runner.os == 'macOS'
        # JUCE 7.0.5 does not compile against the macOS 15 SDK, so stay on Xcode 15.
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          brew install ninja || true

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build ${{ matrix.cmake_args }}
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DAG_DEPS_ROOT="${{ github.workspace }}/ag-deps/${{ matrix.deps }}"
          -DAG_ENABLE_CODE_SIGNING=OFF
          -DAG_ENABLE_DEBUG_COPY_STEP=OFF
          -DAG_WITH_TESTS=OFF
        # The original test runners need third-party plugins that are not in the
        # repository (TestsData) and do not build on Linux; our own tests come in phase 2.

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config ${{ env.BUILD_TYPE }} --parallel 4 2>&1 | tee build.log

      - name: Report build errors
        if: failure()
        shell: bash
        # Surface the first compiler/linker errors as annotations, readable
        # through the API without downloading the full log.
        run: |
          grep -E "error [A-Z]+[0-9]+|: error|fatal error|undefined reference|unresolved external" build.log \
            | grep -v "warning" | sort -u | head -10 \
            | while IFS= read -r line; do echo "::error::${line:0:900}"; done || true

      - name: Collect binaries
        shell: bash
        run: |
          mkdir -p dist
          # Plugin bundles (VST3, AU) and server/tray app bundles (macOS, Windows)
          find build -type d \( -name "*.vst3" -o -name "*.component" -o -name "*.app" \) \
            -not -path "*/CMakeFiles/*" -prune -exec cp -R {} dist/ \;
          # Plugin shared objects (Linux)
          find build/lib -maxdepth 2 -type f -name "AudioGridder*.so" -exec cp {} dist/ \; 2>/dev/null || true
          # Server and tray executables
          find build -type f \( -name "AudioGridderServer" -o -name "AudioGridderServer.exe" \
            -o -name "AudioGridderPluginTray" -o -name "AudioGridderPluginTray.exe" \) \
            -not -path "*/CMakeFiles/*" -not -path "*.app/*" -exec cp {} dist/ \;
          ls -la dist

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: AudioGridder-revamped-${{ matrix.deps }}-${{ github.sha }}
          path: dist
          if-no-files-found: error
