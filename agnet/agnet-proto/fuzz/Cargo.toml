[package]
name = "agnet-proto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
agnet-proto = { path = ".." }

# Fuori dal workspace principale: richiede nightly (cargo +nightly fuzz run <target>)
[workspace]

[[bin]]
name = "frame"
path = "fuzz_targets/frame.rs"
test = false
doc = false

[[bin]]
name = "message"
path = "fuzz_targets/message.rs"
test = false
doc = false

[[bin]]
name = "audio"
path = "fuzz_targets/audio.rs"
test = false
doc = false
